name: CI/CD

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  # ---------------------------------------------------------------
  # Soal 3c: job pengujian backend (php artisan test)
  # ---------------------------------------------------------------
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Pasang dependensi Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Siapkan .env dan APP_KEY
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan php artisan test
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  # ---------------------------------------------------------------
  # Soal 3c: job build frontend (npm ci dan npm run build)
  # ---------------------------------------------------------------
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api

  # ---------------------------------------------------------------
  # Soal 4: deploy (build image Docker dan unggah ke ghcr.io)
  # Hanya jalan untuk push ke branch main. Pull Request, dev, dan
  # branch fitur berhenti setelah job test dan build di atas.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy image ke GHCR
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Nama image di GHCR wajib huruf kecil semua
      - name: Siapkan nama image
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build dan push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BASE }}-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build dan push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_BASE }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000/api' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Soal 4b: nilai rahasia hanya dibaca dari GitHub Secrets saat runtime,
      # tidak pernah ditulis di repository atau dimasukkan ke dalam image.
      - name: Smoke test image backend dengan secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker run --rm -e APP_KEY -e DB_PASSWORD \
            "${IMAGE_BASE}-backend:${GITHUB_SHA}" php artisan --version
