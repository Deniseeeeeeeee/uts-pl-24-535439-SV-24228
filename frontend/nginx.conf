server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permintaan /api diteruskan ke service "app" memakai nama service
    # di jaringan Docker Compose (DNS internal 127.0.0.11), bukan IP laptop.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://app:80;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single Page App: semua path lain dikembalikan ke index.html (vue-router mode history)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
