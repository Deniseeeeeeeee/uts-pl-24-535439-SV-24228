# ------------------------------------------------------------
# P10: logging driver json-file dengan rotasi.
# Log container disimpan Docker sebagai file JSON; tiap file maksimal
# 10 MB dan hanya 3 file terakhir yang disimpan (maks ~30 MB per service),
# supaya disk host tidak penuh oleh log.
# ------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------
  # 6a: service basis data (MySQL)
  # ------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # 6d: data disimpan di named volume, tetap ada setelah "docker compose down"
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *default-logging

  # ------------------------------------------------------------
  # 6a: service backend Laravel (Apache + mod_php)
  # 6b: terhubung ke basis data lewat nama service "db"
  # ------------------------------------------------------------
  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Movie API"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      # P10: log Laravel ke stderr container (bukan storage/logs/laravel.log),
      # dalam format JSON supaya context array terbaca sebagai field.
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
      LOG_LEVEL: info
      CACHE_DRIVER: file
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CONNECT_TIMEOUT: 3
    # P10: DNS lookup ke host "db" yang sedang mati bisa makan ~15 detik.
    # Batasi supaya /health cepat membalas 503, bukan menggantung.
    dns_opt:
      - timeout:1
      - attempts:1
    ports:
      # Opsional: supaya API dan /health bisa diuji langsung dari laptop
      - "8000:80"
    # P10: Docker memanggil GET /health di dalam container.
    # /health membalas 503 kalau DB/cache gagal -> curl -f keluar non-zero -> unhealthy.
    healthcheck:
      # Saat DB mati, lookup DNS "db" masih butuh ~5 detik, jadi batas curl 8 detik.
      test: ["CMD", "curl", "-fsS", "--max-time", "8", "http://localhost/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  # ------------------------------------------------------------
  # 6a: service frontend Vue (Nginx)
  # 6b: Nginx meneruskan /api ke service "app" (lihat frontend/nginx.conf)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    # wget sudah tersedia di image nginx:alpine (BusyBox)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ============================================================
  # P11: layanan pemantauan
  # - Versi image dikunci (bukan :latest) supaya hasil selalu sama.
  # - Port hanya dibuka ke 127.0.0.1 (laptop sendiri), tidak ke jaringan luar.
  # ============================================================

  # Mengumpulkan metrik dari semua target & mengevaluasi aturan alarm
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  # Dashboard
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Password admin WAJIB diisi di .env (GRAFANA_ADMIN_PASSWORD).
      # Kalau kosong, "docker compose up" berhenti dengan error -> tidak pernah jalan dengan admin/admin.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Isi GRAFANA_ADMIN_PASSWORD di file .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/movie-app.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # CPU & memori per container
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      # simpan hanya label compose yang dipakai dashboard (nama service & project)
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8081:8080"
    logging: *default-logging

  # CPU, memori, disk mesin host
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    logging: *default-logging

volumes:
  db_data:
  # P11: data Prometheus & Grafana tetap ada walaupun container dibuat ulang
  prometheus_data:
  grafana_data:
